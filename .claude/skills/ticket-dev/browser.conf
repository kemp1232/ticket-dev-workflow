# ticket-dev browser verification (references/browser-verification.md).
#
# Project override: <repo>/.claude/ticket-dev/browser.conf (set only the keys you
# want to change; later files win per key). KEY=value lines; values may contain
# spaces; nothing here is executed except BROWSER_DEV_COMMAND, and only through
# the verifier's guard. {port} is replaced by this checkout's own port (see
# ticket-env.sh), so parallel worktrees never share a dev server.

# off: never run (default) | auto: run when the ticket changed browser-facing files
# in a web project | required: always run; the ticket cannot end in a clean PASS
# unless browser verification passes. Per ticket: /ticket-dev --browser / --no-browser.
BROWSER_VERIFICATION=off

# Where the app under test answers. Only hosts in BROWSER_ALLOWED_HOSTS (plus any
# *.localhost name) may be opened; production URLs are refused by the guard.
BROWSER_BASE_URL=http://127.0.0.1:{port}
BROWSER_ALLOWED_HOSTS=localhost,127.0.0.1,::1

# Project-defined command that starts the dev server on {port} (PORT is also set).
# Empty: ticket-dev only reuses a server you started yourself. Examples:
#   BROWSER_DEV_COMMAND=npm run dev -- --port {port}
#   BROWSER_DEV_COMMAND=pnpm next dev -p {port}
BROWSER_DEV_COMMAND=

# Seconds to wait for the server to answer (polled once per second).
BROWSER_READY_TIMEOUT=90

# Viewports for responsive checks (WIDTHxHEIGHT).
BROWSER_DESKTOP_VIEWPORT=1280x800
BROWSER_MOBILE_VIEWPORT=390x844

# Extra comma-separated shell patterns that count as browser-facing in auto mode,
# e.g. packages/ui/*,src/i18n/*
BROWSER_FRONTEND_PATHS=

# Repeatable end-to-end suite (Playwright Test or similar). Empty: auto-detected
# from playwright.config.* when @playwright/test is installed.
BROWSER_E2E_COMMAND=
