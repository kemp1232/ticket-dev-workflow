# ticket-dev model routing: the one place to change which model each step uses.
#
# Values are Claude Code model aliases (haiku, sonnet, opus, fable, or a newer
# alias). The orchestrator passes them per subagent invocation, so changing a
# value here does not require editing any agent file.
#
# Pin exact versions with ANTHROPIC_DEFAULT_HAIKU_MODEL / _SONNET_MODEL /
# _OPUS_MODEL in your environment or settings instead of putting IDs here.
#
# Project override: <repo>/.claude/ticket-dev/routing.conf (set only the keys
# you want to change; later files win per key).

# Implementation routes (see references/routing-policy.md)
MODEL_LIGHT=haiku
MODEL_STANDARD=sonnet
MODEL_COMPLEX=opus

# Supporting subagents
MODEL_EXPLORER=haiku
MODEL_VERIFIER=haiku

# Largest number of changed files (including tests) the light route accepts.
LIGHT_MAX_FILES=2

# Routes that get an independent fresh-context review (/code-review) after the
# verifier passes: comma-separated light, standard, complex, or none.
REVIEW_ROUTES=complex
