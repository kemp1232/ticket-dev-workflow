# Browser verification for /ticket-dev. Copy to <repo>/.claude/ticket-dev/browser.conf and
# keep only the keys you change. Example: a Next.js app. {port} is this checkout's own
# port, so tickets running in parallel worktrees each get their own dev server.
BROWSER_VERIFICATION=auto
BROWSER_BASE_URL=http://127.0.0.1:{port}
BROWSER_DEV_COMMAND=npx next dev -p {port}
BROWSER_READY_TIMEOUT=90

# A shared test environment you approve (never production):
# BROWSER_ALLOWED_HOSTS=localhost,127.0.0.1,::1,staging.internal.test

# UI code outside the usual folders:
# BROWSER_FRONTEND_PATHS=packages/ui/*,src/i18n/*

# Existing Playwright Test suite, if its command is not the default:
# BROWSER_E2E_COMMAND=pnpm exec playwright test --reporter=line
