# Project routing override. Copy to <repo>/.claude/ticket-dev/routing.conf and keep only
# the keys you want to change; everything else comes from the installed routing.conf.

# Example: this codebase is subtle, so never use the light route's model below sonnet.
MODEL_LIGHT=sonnet

# Example: evaluate a new model family for complex tickets (benchmark first).
# MODEL_COMPLEX=fable

# Example: this team has approved sending complex tickets' changes to OpenAI for an
# independent Codex CLI review (ChatGPT-authenticated `codex login`). Opt-in per project.
# CODEX_REVIEW_ROUTES=complex
